#######################
# Stellar 主题覆盖配置
# 本文件与主题默认配置（node_modules/hexo-theme-stellar/_config.yml）深度合并，
# 只需在这里写需要修改/覆盖的字段即可。
# 官方文档：https://xaoxuu.com/wiki/stellar/
#######################

######## Sidebar ########
menubar:
  items:
    - id: post
      theme: '#1BCDFC'
      icon: default:documents
      title: 博客
      url: /
    - id: wiki
      theme: '#3DC550'
      icon: example:notebook
      title: 知识库
      url: /wiki/
    - id: about
      theme: '#FA6400'
      icon: example:planet
      title: 关于
      url: /about/

######## Article ########
article:
  # tech: 技术类文章布局；story: 图文生活类布局（可在文章 front-matter 中用 type 单独覆盖）
  type: tech
  # 文章页显示字数与预计阅读时长
  reading_time: true
  # 文章卡片显示标签
  card_tags: true

######## Footer ########
footer:
  sitemap:
    - title: 博客
      items:
        - '[近期发布](/)'
        - '[分类](/categories/)'
        - '[标签](/tags/)'
        - '[归档](/archives/)'
    - title: 知识库
      items:
        - '[知识库列表](/wiki/)'
    - title: 其它
      items:
        - '[关于我](/about/)'
  content: |
    本站由 [{author.name}](/) 使用 [{theme.name} {theme.version}]({theme.repo}) 主题创建。
    本博客所有文章除特别声明外，均采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。

######## Plugins ########
plugins:
  # 卡片鼠标跟随光斑 + 3D 倾斜，提升动感
  card_hover:
    enable: true
  # 滚动进入视口时的渐显动画
  scrollreveal:
    enable: true
    distance: 8px
    duration: 1000
    interval: 100
