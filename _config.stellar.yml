#######################
# Stellar 主题覆盖配置
# 本文件与主题默认配置（node_modules/hexo-theme-stellar/_config.yml）深度合并，
# 只需在这里写需要修改/覆盖的字段即可。
# 官方文档：https://xaoxuu.com/wiki/stellar/
#######################

######## Sidebar ########
menubar:
  items:
    - id: post
      theme: '#00E5FF'
      icon: default:documents
      title: 博客
      url: /blog/
    - id: wiki
      theme: '#00FFA3'
      icon: example:notebook
      title: 知识库
      url: /wiki/
    - id: about
      theme: '#FF2D95'
      icon: example:planet
      title: 关于
      url: /about/

######## Style ########
style:
  # 强制深色模式（黑色科技风）
  prefers_theme: dark
  color:
    theme: 'hsl(187 100% 50%)' # 电光青（主题色）
    accent: 'hsl(330 100% 60%)' # 霓虹品红（强调色）
    link: 'hsl(190 95% 62%)' # 链接色

######## Site Tree ########
site_tree:
  # 首页（个人主页）为沉浸式全屏布局，不显示左右侧栏
  home:
    leftbar: ''
    rightbar: ''
  page:
    leftbar: recent
    rightbar: ''

######## Head 注入 ########
inject:
  head:
    - '<link rel="preconnect" href="https://fonts.googleapis.com">'
    - '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
    - '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap">'
    - '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">'
    - '<link rel="stylesheet" href="/css/tech.css?v=20260822">'
    - '<link rel="stylesheet" href="/css/home.css?v=20260822b">'
    - '<script defer src="/js/home.js?v=20260822"></script>'

######## Article ########
article:
  # tech: 技术类文章布局；story: 图文生活类布局（可在文章 front-matter 中用 type 单独覆盖）
  type: tech
  # 文章页显示字数与预计阅读时长
  reading_time: true
  # 文章卡片显示标签
  card_tags: true

######## Footer ########
footer:
  sitemap:
    - title: 博客
      items:
        - '[主页](/)'
        - '[近期发布](/blog/)'
        - '[分类](/categories/)'
        - '[标签](/tags/)'
        - '[归档](/archives/)'
    - title: 知识库
      items:
        - '[知识库列表](/wiki/)'
    - title: 其它
      items:
        - '[关于我](/about/)'
  content: |
    本站由 [{author.name}](/) 使用 [{theme.name} {theme.version}]({theme.repo}) 主题创建。
    本博客所有文章除特别声明外，均采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。

######## Plugins ########
plugins:
  # 卡片鼠标跟随光斑 + 3D 倾斜，提升动感
  card_hover:
    enable: true
    spotlight_color: 'rgba(0, 229, 255, 0.10)'
  # 滚动进入视口时的渐显动画
  scrollreveal:
    enable: true
    distance: 8px
    duration: 1000
    interval: 100
