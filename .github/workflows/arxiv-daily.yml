name: Publish arXiv daily digest

on:
  schedule:
    # 09:30 Asia/Shanghai. The script collects the previous local calendar day.
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date in YYYY-MM-DD; blank means yesterday in Asia/Shanghai'
        required: false
        type: string
      month:
        description: 'Backfill a month in YYYY-MM; leave blank for daily mode'
        required: false
        type: string
      max_papers:
        description: 'Maximum papers in the digest'
        required: false
        default: '20'
        type: string
      llm_max_papers:
        description: 'Maximum papers to summarize with Kimi'
        required: false
        default: '30'
        type: string
      force:
        description: 'Regenerate an existing date (manual verification only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: arxiv-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.change.outputs.changed }}
    env:
      TZ: Asia/Shanghai
      ARXIV_DAILY_DATE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.date || '' }}
      ARXIV_DAILY_MONTH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.month || '' }}
      ARXIV_DAILY_MAX: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_papers || '20' }}
      ARXIV_DAILY_LLM_MAX: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.llm_max_papers || '30' }}
      ARXIV_DAILY_FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force || 'false' }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      KIMI_API_URL: ${{ vars.KIMI_API_URL || 'https://api.kimi.com/coding/v1/chat/completions' }}
      KIMI_MODEL: ${{ vars.KIMI_MODEL || 'kimi-for-coding' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and write arXiv digest
        run: npm run arxiv:daily

      - name: Commit digest
        id: change
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- source/_posts)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new digest to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/_posts
          git commit -m "post: publish arXiv daily digest"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build Hexo site
        run: |
          npm run build
          if find public -type f -size 0 | grep -q .; then
            echo "Build contains zero-byte files"
            find public -type f -size 0 -print
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
